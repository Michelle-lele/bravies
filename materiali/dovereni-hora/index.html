<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Моите доверени хора — безплатен лист за печат за деца | Смелчовци в беда</title>
  <meta name="description" content="„Моите доверени хора“ - Безплатен лист за печат с героите от „Смелчовци в беда“. Изберете заедно до петима доверени възрастни и запишете имената им в пръстите на ръката." />

  <!-- Trailing slash, same convention as the landing page: GitHub Pages
       serves materiali/dovereni-hora/index.html at /materiali/dovereni-hora/. -->
  <link rel="canonical" href="https://smelcho.bg/materiali/dovereni-hora/" />

  <!-- Open Graph / Twitter Card. og:image is the site's existing 1200×630
       card, not the sheet preview: WebP support in link previews is uneven
       (Viber, WhatsApp), and A4 landscape (1.41:1) is still not the 1.91:1
       a share card expects, so it would be cropped. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Смелчовци в беда" />
  <meta property="og:locale" content="bg_BG" />
  <meta property="og:url" content="https://smelcho.bg/materiali/dovereni-hora/" />
  <meta property="og:title" content="Моите доверени хора — безплатен лист за печат" />
  <meta property="og:description" content="Изберете заедно до петима доверени възрастни и запишете имената им в пръстите на ръката." />
  <meta property="og:image" content="https://smelcho.bg/assets/og/og-image-1200x630.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Смелчовци в беда — карти за детска безопасност" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Моите доверени хора — безплатен лист за печат" />
  <meta name="twitter:description" content="Изберете заедно до петима доверени възрастни и запишете имената им в пръстите на ръката." />
  <meta name="twitter:image" content="https://smelcho.bg/assets/og/og-image-1200x630.png" />

  <!-- Literal --color-neda; <meta> can't read a custom property. -->
  <meta name="theme-color" content="#FDD43B" />

  <link rel="icon" href="../../assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="../../assets/icons/favicon-192.png" sizes="192x192" type="image/png" />
  <link rel="icon" href="../../assets/icons/favicon-512.png" sizes="512x512" type="image/png" />
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon-180.png" />

  <!-- Same two preloads as the landing page; this page uses only Dela
       Gothic One 400 and Nunito Sans 600. Paths are `../../` because the page
       sits two levels down. -->
  <link rel="preload" href="../../assets/fonts/dela-gothic-one-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../../assets/fonts/nunito-sans-cyrillic-600-normal.woff2" as="font" type="font/woff2" crossorigin />

  <link rel="stylesheet" href="../../style.css" />
</head>
<!-- data-no-scroll-depth: script.js is loaded here for $pageview and
     file_downloaded only; scroll_depth is a landing-page metric. -->
<body data-no-scroll-depth>
  <main class="materials">
    <!-- id="hero": initHeroClouds() in script.js looks for #hero and drives
         the clouds' --scroll-progress, exactly as on the landing page. The
         cloud markup and .cloud--1…4 classes are the landing page's own. -->
    <header class="materials__header" id="hero">
      <div class="hero__clouds" aria-hidden="true">
        <span class="cloud cloud--1"></span>
        <span class="cloud cloud--2"></span>
        <span class="cloud cloud--3"></span>
        <span class="cloud cloud--4"></span>
      </div>

      <div class="materials__header-inner">
        <h1 class="materials__title">Моите доверени хора</h1>
        <p class="materials__lead">Безплатен лист за печат с героите от „Смелчовци в беда“. Изберете заедно до петима доверени възрастни и запишете имената им в пръстите на ръката.</p>

        <div class="materials__actions">
          <!-- Plain download link; works with JS off. script.js only
               listens for the click to send file_downloaded. -->
          <a
            class="cta-button materials__download"
            href="../../assets/materiali/dovereni-hora.pdf"
            download
            data-track-download
          >Свали за печат (PDF)</a>

          <a class="materials__more" href="../../">Научи повече за Смелчовци в беда →</a>
        </div>
      </div>
    </header>

    <div class="materials__body">
      <!-- A4 landscape (297×210). width/height are the A4 ratio at 96dpi;
           CSS aspect-ratio keeps the box A4 whatever the file's own size. -->
      <img
        class="materials__preview"
        src="../../assets/materiali/dovereni-hora-preview.webp"
        alt="Лист „Моите доверени хора“: контур на ръка, в чиито пръсти детето записва имената на петима доверени възрастни"
        width="1123"
        height="794"
        loading="eager"
        decoding="async"
      />
    </div>

    <!-- Yellow footer: the landing page's own link row (its
         .waitlist-signup__footer* classes are reused as-is, not copied). -->
    <footer class="materials__footer">
      <nav class="waitlist-signup__footer" aria-label="Социални мрежи и правила">
        <ul class="waitlist-signup__footer-list">
          <li>
            <a class="waitlist-signup__footer-link" href="https://www.facebook.com/smelcho" target="_blank" rel="noopener">
              <img class="waitlist-signup__footer-icon" src="../../assets/social/facebook.png" alt="Facebook" width="28" height="28" loading="lazy" decoding="async" />
            </a>
          </li>
          <li>
            <a class="waitlist-signup__footer-link" href="https://www.instagram.com/smelcho.bg/" target="_blank" rel="noopener">
              <img class="waitlist-signup__footer-icon waitlist-signup__footer-icon--inset" src="../../assets/social/instagram.png" alt="Instagram" width="28" height="28" loading="lazy" decoding="async" />
            </a>
          </li>
          <li>
            <a class="waitlist-signup__footer-link waitlist-signup__footer-link--text" href="../../privacy.html" target="_blank" rel="noopener">Политика за поверителност</a>
          </li>
        </ul>
      </nav>
    </footer>
  </main>

  <script src="../../script.js"></script>
</body>
</html>
